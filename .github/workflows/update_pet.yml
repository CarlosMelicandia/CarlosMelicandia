name: Update Tea Pet

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  push:
    branches: [main]
  workflow_dispatch:          # run manually from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Count commits in last 30 days
        id: count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SINCE=$(date -d '30 days ago' +%Y-%m-%d)
          COMMITS=$(gh api \
            -H "Accept: application/vnd.github.cloak-preview" \
            "search/commits?q=author:carlosmelicandia+committer-date:>${SINCE}&per_page=1" \
            --jq '.total_count')
          echo "commits=${COMMITS}" >> "$GITHUB_OUTPUT"
          echo "🫖 Found ${COMMITS} commits since ${SINCE}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate tea pet SVG
        env:
          COMMITS: ${{ steps.count.outputs.commits }}
        run: |
          python generate_pet.py "${COMMITS}" > teapet.svg

      - name: Commit updated SVG
        env:
          COMMITS: ${{ steps.count.outputs.commits }}
        run: |
          git config user.name  "tea-pet-bot"
          git config user.email "bot@users.noreply.github.com"
          git add teapet.svg
          if ! git diff --staged --quiet; then
            git commit -m "🫖 tea pet update (${COMMITS} commits)"
            git push
          fi
